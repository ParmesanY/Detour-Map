# The GitHub Pages mirror of the map: site/public plus data/external.json rebuilt from OONI, the RKN register
# (antifilter) and spec/events.json. Runs on every push to main that touches the site or the specs, and daily.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "spec/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch other sources
        run: node site/tools/fetch-external.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
