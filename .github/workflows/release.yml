# detour-probe as a single native executable (AOT, no .NET needed) for Windows and Linux, attached to a GitHub
# release with SHA-256 sums. Runs on a version tag: git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Version from the tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || v="0.0.0"
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Test
        if: runner.os == 'Windows'
        run: dotnet test --project probe/Detour.NetProbe.Tests
      - name: Publish
        run: dotnet publish probe/Detour.NetProbe.Cli -c Release -r ${{ matrix.rid }} -p:Version=${{ env.VERSION }} -o out
      - name: Package
        shell: bash
        run: |
          name="detour-probe-${VERSION}-${{ matrix.rid }}"
          mkdir -p "pkg/$name"
          cp out/detour-probe* "pkg/$name/" 2>/dev/null || true
          cp out/msquic.dll "pkg/$name/" 2>/dev/null || true
          rm -f "pkg/$name"/*.pdb "pkg/$name"/*.dbg
          cp LICENSE "pkg/$name/"
          cd pkg
          if [[ "${{ runner.os }}" == "Windows" ]]; then 7z a -tzip "$name.zip" "$name" > /dev/null; else tar -czf "$name.tar.gz" "$name"; fi
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          # Only the archives: the unpacked folder's name has dots too and would match a looser pattern.
          path: |
            pkg/*.zip
            pkg/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.zip *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "detour-probe $GITHUB_REF_NAME" --notes "$(cat <<'EOF'
          **detour-probe**: what your ISP blocks and how (probe), how one site is blocked (trace), which zapret / ByeDPI strategy gets through (tune).

          Windows: unzip and run `detour-probe.exe trace youtube.com` in a terminal. Linux: `tar xzf …` and `./detour-probe trace youtube.com`.
          Nothing is sent anywhere unless you pass `--send` or `--share`. Checksums: `SHA256SUMS.txt`.

          Antivirus warnings: the exe is unsigned and talks to the network, so some antiviruses flag it. Compare its SHA-256 with `SHA256SUMS.txt`; the build log of this release shows how it was made.
          EOF
          )"
